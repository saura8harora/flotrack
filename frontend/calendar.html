<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - FloTrack</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/calendar.css?v=2">
</head>
<body class="app-body grid-background">
  <div class="app-layout" id="calendar-page">
    <div id="sidebar-container"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Calendar</h1>
        <p>Plan days · track habits · manage tasks</p>
      </div>

      <div class="calendar-layout">
        <div class="calendar-main">
          <div class="calendar-header">
            <h2 id="calendar-title"></h2>
            <div style="display:flex;gap:12px;align-items:center">
              <button class="btn btn-primary btn-sm" id="add-habit-btn">+ Habit</button>
              <div class="calendar-nav">
                <button class="btn btn-secondary btn-sm" id="prev-month">←</button>
                <button class="btn btn-secondary btn-sm" id="next-month">→</button>
              </div>
            </div>
          </div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <aside class="calendar-panel hidden-panel" id="day-panel">
          <div class="calendar-panel-header">
            <div class="window-controls"><span></span><span></span></div>
            <h3 id="panel-date">day_detail.html</h3>
          </div>
          <div class="calendar-panel-body">
            <div class="panel-section">
              <h4>Tasks</h4>
              <div id="panel-tasks"></div>
            </div>
            <div class="panel-section">
              <h4>Habits</h4>
              <div id="panel-habits"></div>
            </div>
            <div class="panel-section">
              <h4>Notes</h4>
              <div id="panel-notes"></div>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="habit-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>New Habit</h2>
        <button class="btn-icon" id="close-habit-modal">✕</button>
      </div>
      <form id="habit-form">
        <input type="hidden" id="habit-id">
        <div class="form-group">
          <label for="habit-title">Title</label>
          <input type="text" id="habit-title" class="form-control" placeholder="Gym" required>
        </div>
        <div class="form-group">
          <label for="habit-category">Category</label>
          <input type="text" id="habit-category" class="form-control" placeholder="Fitness" required>
        </div>
        <div class="form-group">
          <label for="habit-xp">XP Reward</label>
          <input type="number" id="habit-xp" class="form-control" value="10" min="1" max="1000" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancel-habit-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Create →</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/calendar.js"></script>
</body>
</html>
