<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - FloTrack</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/tasks.css">
</head>
<body class="app-body grid-background">
  <div class="app-layout" id="tasks-page">
    <div id="sidebar-container"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Tasks</h1>
        <p id="tasks-subtitle">Kanban board — dump · later · done</p>
      </div>

      <div class="tasks-date-banner hidden" id="tasks-date-banner">
        <div class="tasks-date-info">
          <span class="tasks-date-label" id="tasks-date-label"></span>
        </div>
        <div class="tasks-date-actions">
          <button class="btn btn-secondary btn-sm" id="back-to-calendar">← Calendar</button>
          <button class="btn btn-secondary btn-sm" id="clear-date-filter">View All Tasks</button>
        </div>
      </div>

      <div class="tasks-toolbar">
        <button class="btn btn-primary" id="add-task-btn">+ New Task</button>
      </div>

      <div class="tasks-board">
        <div class="task-column">
          <div class="column-header">
            <h3>Dump <span class="column-count" id="count-dump">0</span></h3>
          </div>
          <div class="column-body" id="column-dump"></div>
        </div>
        <div class="task-column">
          <div class="column-header">
            <h3>Later <span class="column-count" id="count-later">0</span></h3>
          </div>
          <div class="column-body" id="column-later"></div>
        </div>
        <div class="task-column">
          <div class="column-header">
            <h3>Done <span class="column-count" id="count-done">0</span></h3>
          </div>
          <div class="column-body" id="column-done"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="task-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Task Editor</h2>
        <button class="btn-icon" id="close-task-modal">✕</button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <div class="form-group">
          <label for="task-title">Title</label>
          <input type="text" id="task-title" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="task-status">Status</label>
          <select id="task-status" class="form-control">
            <option value="dump">Dump</option>
            <option value="later">Later</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="form-group">
          <label for="task-priority">Priority</label>
          <select id="task-priority" class="form-control">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancel-task-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save →</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/tasks.js"></script>
</body>
</html>
