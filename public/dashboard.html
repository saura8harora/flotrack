<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - FloTrack</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="app-body grid-background">
  <div class="app-layout" id="dashboard-page">
    <div id="sidebar-container"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Dashboard</h1>
        <p>Daily productivity overview</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-header">total_xp.dat</div>
          <div class="stat-card-body">
            <div class="stat-value" id="stat-xp">0</div>
            <div class="stat-sub">Earn via habits</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">level.sys</div>
          <div class="stat-card-body">
            <div class="stat-value" id="stat-level">1</div>
            <div class="stat-sub">100 XP / level</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">streak.log</div>
          <div class="stat-card-body">
            <div class="stat-value" id="stat-streak">0</div>
            <div class="stat-sub">Days in a row</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">productivity.pct</div>
          <div class="stat-card-body">
            <div class="stat-value" id="stat-productivity">0%</div>
            <div class="stat-sub">Today's score</div>
          </div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="dashboard-section">
          <div class="dashboard-section-header">
            <div class="window-controls"><span></span><span></span></div>
            <h3>habits_today.html</h3>
          </div>
          <div class="dashboard-section-body" id="habits-list"></div>
        </div>
        <div class="dashboard-section">
          <div class="dashboard-section-header">
            <div class="window-controls"><span></span><span></span></div>
            <h3>tasks_today.html</h3>
          </div>
          <div class="dashboard-section-body" id="tasks-list"></div>
        </div>
        <div class="dashboard-section full-width">
          <div class="dashboard-section-header">
            <div class="window-controls"><span></span><span></span></div>
            <h3>productivity_summary.html</h3>
          </div>
          <div class="dashboard-section-body">
            <div id="productivity-ring" class="productivity-ring"></div>
            <div class="prod-stats">
              <div>
                <div class="prod-stat-val" id="prod-habits">0/0</div>
                <div class="prod-stat-label">Habits</div>
              </div>
              <div>
                <div class="prod-stat-val" id="prod-tasks">0/0</div>
                <div class="prod-stat-label">Tasks</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
