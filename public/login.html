<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FloTrack</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="grid-background">
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-logo">
        <a href="/dashboard.html" class="auth-logo-link">
          <h1>FloTrack</h1>
        </a>
        <p>Productivity Operating System</p>
      </div>
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="window-controls"><span></span><span></span></div>
          <span class="window-title">login.html</span>
        </div>
        <div class="auth-card-body">
          <h2>Sign In</h2>
          <div id="auth-error" class="alert alert-error hidden"></div>
          <form id="login-form">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In →</button>
          </form>
        </div>
      </div>
      <div class="auth-footer">
        No account? <a href="/signup.html">Create one</a>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
